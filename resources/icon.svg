<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tulis Noon app icon — 1024×1024.
  Desain: flat hijau + huruf ن (noon) putih. Full-bleed (iOS/Android handle rounding).
  Huruf ن digambar pakai path (bowl + titik) supaya crisp tanpa butuh font Arab.
  Regenerate PNG + platform assets: npx capacitor-assets generate
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Background: flat green rounded square -->
  <rect width="1024" height="1024" rx="230" ry="230" fill="#0a4d3c"/>

  <!-- Huruf ن (noon): bowl (mangkuk) + titik di atas -->
  <!-- Bowl: setengah lingkaran terbuka ke atas, garis tebal, ujung membulat -->
  <path d="M 342 560 A 170 170 0 0 0 682 560"
        fill="none" stroke="#ffffff" stroke-width="86" stroke-linecap="round"/>
  <!-- Titik ن -->
  <circle cx="512" cy="360" r="50" fill="#ffffff"/>
</svg>
